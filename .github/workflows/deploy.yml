name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # CV PDF 는 사이트와 같은 데이터에서 나오므로 배포할 때마다 최신 상태로 다시 굽는다.
      # 실패해도 사이트 배포는 계속한다. /[lang]/cv 의 브라우저 인쇄가 상시 대체 수단이다.
      - name: Install Chromium for CV PDF
        run: npx playwright install --with-deps chromium chromium-headless-shell
        continue-on-error: true
      - name: Generate CV PDFs
        run: npm run cv:pdf
        continue-on-error: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ github.event.repository.html_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
